<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<script>if(/\bLine\//i.test(navigator.userAgent)&&!/openExternalBrowser/.test(location.search)){location.replace(location.href+(location.search?'&':'?')+'openExternalBrowser=1')}</script>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('adminTheme')||'light'}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>商店後台</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<div id="login" class="login" hidden>
  <div class="login-box">
    <div class="brand-mark">商店後台</div>
    <p class="muted">請用已授權的 Google 帳號登入</p>
    <button class="btn primary block" id="googleLogin">使用 Google 帳號登入</button>
    <p class="err" id="loginErr" hidden></p>
  </div>
</div>

<div id="app" class="app" hidden>
  <header class="topbar">
    <button class="icon-btn nav-toggle" id="navToggle" aria-label="選單"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
    <a class="brand" href="/admin" id="brand">商店後台</a>
    <div class="top-tools">
      <a class="icon-btn" href="/" target="_blank" rel="noopener" title="查看前台" aria-label="查看前台"><svg viewBox="0 0 24 24"><path d="M4 9 5.5 4h13L20 9M4 9v11h16V9M4 9c0 1.7 1.3 3 3 3s3-1.3 3-3c0 1.7 1.3 3 2 3s3-1.3 3-3c0 1.7 1.3 3 3 3s3-1.3 3-3"/><path d="M10 20v-5h4v5"/></svg></a>
      <button class="icon-btn" id="themeBtn" title="深色／淺色" aria-label="切換深色模式"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"/></svg></button>
      <div class="who" id="who"></div>
    </div>
  </header>
  <nav class="sidebar" id="sidebar" aria-label="後台選單"></nav>
  <div class="scrim" id="scrim"></div>
  <main class="content" id="view" tabindex="-1"></main>
</div>

<div class="modal" id="modal" hidden><div class="modal-bg"></div><div class="modal-box" id="modalBox" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/admin/app.js"></script>
</body>
</html>
